# scribe-managed v1
name: scribe-check
on:
  pull_request:
jobs:
  scribe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run --frozen --project . scribe check --base "origin/${{ github.base_ref }}"
